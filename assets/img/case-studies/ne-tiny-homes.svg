<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%" role="img" aria-labelledby="t d">
  <title id="t">Demo: one board connecting contracts, permit milestones, build phases and SOPs</title>
  <desc id="d">An example monday.com style board with demo data. It is not a screenshot of a client account.</desc>
  <defs>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.07"/>
    </filter>
  </defs>
  <style>
    text { font-family: Inter, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .h { font-size: 15px; font-weight: 700; fill: #0F172A; }
    .s { font-size: 12px; font-weight: 500; fill: #64748B; }
    .c { font-size: 13px; font-weight: 600; fill: #0F172A; }
    .p { font-size: 11px; font-weight: 700; }
    .lab { font-size: 11px; font-weight: 700; fill: #94A3B8; letter-spacing: 0.6px; }
    .th { font-size: 12px; font-weight: 700; fill: #475569; }
  </style>

  <!-- Window -->
  <rect x="0" y="0" width="1200" height="750" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <path d="M0 18 Q0 0 18 0 H1182 Q1200 0 1200 18 V54 H0 Z" fill="#FFFFFF"/>
  <line x1="0" y1="54" x2="1200" y2="54" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="30" cy="27" r="6.5" fill="#EF4444"/><circle cx="52" cy="27" r="6.5" fill="#F59E0B"/><circle cx="74" cy="27" r="6.5" fill="#10B981"/>
  <rect x="120" y="14" width="640" height="26" rx="7" fill="#F1F5F9"/>
  <text x="140" y="31" class="s">Build tracker · example board</text>
  <rect x="1094" y="14" width="80" height="26" rx="13" fill="#F1F5F9" stroke="#CBD5E1"/>
  <circle cx="1112" cy="27" r="4" fill="#94A3B8"/>
  <text x="1124" y="31.5" font-size="12" font-weight="700" fill="#475569">Demo</text>

  <!-- Flow strip -->
  <text x="36" y="92" class="lab">ONE FLOW, CONTRACT TO FINAL BUILD</text>
  <g transform="translate(36,106)">
    <g>
      <rect width="262" height="86" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh)"/>
      <rect x="18" y="20" width="12" height="12" rx="3" fill="#3B82F6"/><text x="40" y="31" class="h">Contracts</text>
      <text x="18" y="62" class="s">Signed contract starts the job</text>
    </g>
    <g transform="translate(288,0)">
      <rect width="262" height="86" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh)"/>
      <rect x="18" y="20" width="12" height="12" rx="3" fill="#F59E0B"/><text x="40" y="31" class="h">Permit milestones</text>
      <text x="18" y="62" class="s">Each permit step has an owner</text>
    </g>
    <g transform="translate(576,0)">
      <rect width="262" height="86" rx="12" fill="#FFF7ED" stroke="#FDBA74" filter="url(#sh)"/>
      <rect x="18" y="20" width="12" height="12" rx="3" fill="#C2410C"/><text x="40" y="31" class="h" fill="#9A3412">Build phases</text>
      <text x="18" y="62" class="s">Phases move in order on the floor</text>
    </g>
    <g transform="translate(864,0)">
      <rect width="264" height="86" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh)"/>
      <rect x="18" y="20" width="12" height="12" rx="3" fill="#10B981"/><text x="40" y="31" class="h">SOPs</text>
      <text x="18" y="62" class="s">The right checklist on each phase</text>
    </g>
    <g fill="#C2410C"><path d="M268 38 l12 5 -12 5z"/><path d="M556 38 l12 5 -12 5z"/><path d="M844 38 l12 5 -12 5z"/></g>
  </g>

  <!-- Table -->
  <text x="36" y="236" class="lab">ACTIVE BUILDS</text>
  <g transform="translate(36,250)">
    <rect width="1128" height="464" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="24" y="38" class="th">Home</text>
    <text x="210" y="38" class="th">Contract</text>
    <text x="370" y="38" class="th">Deposit</text>
    <text x="530" y="38" class="th">Permit</text>
    <text x="700" y="38" class="th">Build phase</text>
    <text x="900" y="38" class="th">SOP</text>
    <line x1="16" y1="54" x2="1112" y2="54" stroke="#E2E8F0"/>

    <!-- Row 1 -->
    <text x="24" y="96" class="c">Home A · 28 ft</text>
    <rect x="206" y="82" width="86" height="22" rx="11" fill="#ECFDF5"/><text x="218" y="97" class="p" fill="#059669">Signed</text>
    <rect x="366" y="82" width="70" height="22" rx="11" fill="#ECFDF5"/><text x="378" y="97" class="p" fill="#059669">Paid</text>
    <rect x="526" y="82" width="100" height="22" rx="11" fill="#ECFDF5"/><text x="538" y="97" class="p" fill="#059669">Approved</text>
    <rect x="696" y="82" width="100" height="22" rx="11" fill="#FFF7ED"/><text x="708" y="97" class="p" fill="#C2410C">Framing</text>
    <text x="900" y="97" class="s">Framing checklist</text>
    <line x1="16" y1="124" x2="1112" y2="124" stroke="#F1F5F9"/>

    <!-- Row 2 -->
    <text x="24" y="166" class="c">Home B · 24 ft</text>
    <rect x="206" y="152" width="86" height="22" rx="11" fill="#ECFDF5"/><text x="218" y="167" class="p" fill="#059669">Signed</text>
    <rect x="366" y="152" width="70" height="22" rx="11" fill="#ECFDF5"/><text x="378" y="167" class="p" fill="#059669">Paid</text>
    <rect x="526" y="152" width="100" height="22" rx="11" fill="#FEF3C7"/><text x="538" y="167" class="p" fill="#B45309">Submitted</text>
    <rect x="696" y="152" width="100" height="22" rx="11" fill="#F1F5F9"/><text x="708" y="167" class="p" fill="#475569">Not started</text>
    <text x="900" y="167" class="s">Pre-build checklist</text>
    <line x1="16" y1="194" x2="1112" y2="194" stroke="#F1F5F9"/>

    <!-- Row 3 -->
    <text x="24" y="236" class="c">Home C · 32 ft</text>
    <rect x="206" y="222" width="86" height="22" rx="11" fill="#FEF3C7"/><text x="218" y="237" class="p" fill="#B45309">Sent</text>
    <rect x="366" y="222" width="70" height="22" rx="11" fill="#F1F5F9"/><text x="378" y="237" class="p" fill="#475569">Due</text>
    <rect x="526" y="222" width="100" height="22" rx="11" fill="#F1F5F9"/><text x="538" y="237" class="p" fill="#475569">Not started</text>
    <rect x="696" y="222" width="100" height="22" rx="11" fill="#F1F5F9"/><text x="708" y="237" class="p" fill="#475569">Not started</text>
    <text x="900" y="237" class="s">Contract checklist</text>
    <line x1="16" y1="264" x2="1112" y2="264" stroke="#F1F5F9"/>

    <!-- Milestone payments -->
    <text x="24" y="304" class="lab">MILESTONE PAYMENTS · HOME A</text>
    <g transform="translate(24,322)">
      <line x1="20" y1="30" x2="1060" y2="30" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>
      <line x1="20" y1="30" x2="540" y2="30" stroke="#C2410C" stroke-width="4" stroke-linecap="round"/>
      <circle cx="20" cy="30" r="11" fill="#C2410C"/><text x="0" y="72" class="c">Contract deposit</text><text x="0" y="90" class="s">Received</text>
      <circle cx="540" cy="30" r="11" fill="#C2410C"/><text x="490" y="72" class="c">Framing sign-off</text><text x="490" y="90" class="s">Due when framing passes</text>
      <circle cx="1060" cy="30" r="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/><text x="990" y="72" class="c">Final build</text><text x="990" y="90" class="s">Not due yet</text>
    </g>
  </g>
</svg>
