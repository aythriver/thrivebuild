<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%" role="img" aria-labelledby="t d">
  <title id="t">Demo: solar sales CRM with a sales pipeline, an admin board and an upsells board</title>
  <desc id="d">An example monday.com style board with demo data. It is not a screenshot of a client account.</desc>
  <defs>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.07"/>
    </filter>
  </defs>
  <style>
    text { font-family: Inter, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .h { font-size: 15px; font-weight: 700; fill: #0F172A; }
    .s { font-size: 12px; font-weight: 500; fill: #64748B; }
    .c { font-size: 13px; font-weight: 600; fill: #0F172A; }
    .p { font-size: 11px; font-weight: 700; }
    .lab { font-size: 11px; font-weight: 700; fill: #94A3B8; letter-spacing: 0.6px; }
  </style>

  <!-- Window -->
  <rect x="0" y="0" width="1200" height="750" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <path d="M0 18 Q0 0 18 0 H1182 Q1200 0 1200 18 V54 H0 Z" fill="#FFFFFF"/>
  <line x1="0" y1="54" x2="1200" y2="54" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="30" cy="27" r="6.5" fill="#EF4444"/><circle cx="52" cy="27" r="6.5" fill="#F59E0B"/><circle cx="74" cy="27" r="6.5" fill="#10B981"/>
  <rect x="120" y="14" width="640" height="26" rx="7" fill="#F1F5F9"/>
  <text x="140" y="31" class="s">Solar sales CRM · example board</text>
  <rect x="1094" y="14" width="80" height="26" rx="13" fill="#F1F5F9" stroke="#CBD5E1"/>
  <circle cx="1112" cy="27" r="4" fill="#94A3B8"/>
  <text x="1124" y="31.5" font-size="12" font-weight="700" fill="#475569">Demo</text>

  <!-- Sales pipeline board -->
  <text x="36" y="92" class="lab">SALES PIPELINE</text>
  <g transform="translate(36,106)">
    <rect width="740" height="270" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <!-- columns -->
    <g transform="translate(16,16)">
      <rect width="224" height="238" rx="9" fill="#F1F5F9"/>
      <rect x="12" y="13" width="10" height="10" rx="3" fill="#3B82F6"/><text x="30" y="23" class="h" font-size="13">New lead</text>
      <rect x="10" y="40" width="204" height="84" rx="8" fill="#fff" filter="url(#sh)"/>
      <text x="22" y="64" class="c">Sarah M.</text><text x="22" y="82" class="s">8 kW solar + battery</text>
      <rect x="22" y="94" width="92" height="20" rx="10" fill="#ECFDF5"/><text x="31" y="108" class="p" fill="#059669">Reply sent</text>
      <rect x="10" y="134" width="204" height="84" rx="8" fill="#fff" filter="url(#sh)"/>
      <text x="22" y="158" class="c">James T.</text><text x="22" y="176" class="s">6 kW solar</text>
      <rect x="22" y="188" width="104" height="20" rx="10" fill="#FFF7ED"/><text x="31" y="202" class="p" fill="#C2410C">Follow-up due</text>
    </g>
    <g transform="translate(258,16)">
      <rect width="224" height="238" rx="9" fill="#F1F5F9"/>
      <rect x="12" y="13" width="10" height="10" rx="3" fill="#8B5CF6"/><text x="30" y="23" class="h" font-size="13">Proposal sent</text>
      <rect x="10" y="40" width="204" height="84" rx="8" fill="#fff" filter="url(#sh)"/>
      <text x="22" y="64" class="c">Priya K.</text><text x="22" y="82" class="s">10 kW solar</text>
      <rect x="22" y="94" width="110" height="20" rx="10" fill="#F5F3FF"/><text x="31" y="108" class="p" fill="#7C3AED">Awaiting e-sign</text>
    </g>
    <g transform="translate(500,16)">
      <rect width="224" height="238" rx="9" fill="#FFF7ED" stroke="#FDBA74"/>
      <rect x="12" y="13" width="10" height="10" rx="3" fill="#C2410C"/><text x="30" y="23" class="h" font-size="13" fill="#9A3412">Signed</text>
      <rect x="10" y="40" width="204" height="84" rx="8" fill="#fff" filter="url(#sh)"/>
      <text x="22" y="64" class="c">Emma L.</text><text x="22" y="82" class="s">Moved to admin board</text>
      <rect x="22" y="94" width="120" height="20" rx="10" fill="#FFEDD5"/><text x="31" y="108" class="p" fill="#C2410C">Handed to admin</text>
    </g>
  </g>

  <!-- Upsells board -->
  <text x="800" y="92" class="lab">UPSELLS</text>
  <g transform="translate(800,106)">
    <rect width="364" height="270" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="20" y="34" class="s" font-weight="700" fill="#475569">Customer</text><text x="160" y="34" class="s" font-weight="700" fill="#475569">Add-on</text><text x="270" y="34" class="s" font-weight="700" fill="#475569">Status</text>
    <line x1="16" y1="46" x2="348" y2="46" stroke="#E2E8F0"/>
    <text x="20" y="80" class="c">Emma L.</text><text x="160" y="80" class="s">Battery</text>
    <rect x="266" y="66" width="80" height="20" rx="10" fill="#ECFDF5"/><text x="276" y="80" class="p" fill="#059669">Signed</text>
    <line x1="16" y1="100" x2="348" y2="100" stroke="#F1F5F9"/>
    <text x="20" y="134" class="c">Daniel R.</text><text x="160" y="134" class="s">EV charger</text>
    <rect x="266" y="120" width="80" height="20" rx="10" fill="#FFF7ED"/><text x="276" y="134" class="p" fill="#C2410C">Quoted</text>
    <line x1="16" y1="154" x2="348" y2="154" stroke="#F1F5F9"/>
    <text x="20" y="188" class="c">Nina W.</text><text x="160" y="188" class="s">Battery</text>
    <rect x="266" y="174" width="80" height="20" rx="10" fill="#F1F5F9"/><text x="276" y="188" class="p" fill="#475569">New</text>
    <rect x="16" y="222" width="332" height="30" rx="7" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="30" y="241" class="s">Matched to the main admin board</text>
  </g>

  <!-- Admin board -->
  <text x="36" y="414" class="lab">ADMIN · FUNDING AND JOB PROGRESS</text>
  <g transform="translate(36,428)">
    <rect width="1128" height="286" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <g class="s" font-weight="700" fill="#475569">
      <text x="24" y="36">Customer</text><text x="250" y="36">Funding (from funding tool)</text><text x="520" y="36">Job progress</text><text x="760" y="36">Sales can see</text>
    </g>
    <line x1="16" y1="50" x2="1112" y2="50" stroke="#E2E8F0"/>

    <text x="24" y="90" class="c">Emma L.</text>
    <rect x="250" y="76" width="112" height="22" rx="11" fill="#ECFDF5"/><text x="262" y="91" class="p" fill="#059669">Approved</text>
    <rect x="520" y="80" width="190" height="10" rx="5" fill="#E2E8F0"/><rect x="520" y="80" width="70" height="10" rx="5" fill="#C2410C"/>
    <text x="760" y="91" class="s">Site survey booked</text>

    <line x1="16" y1="114" x2="1112" y2="114" stroke="#F1F5F9"/>
    <text x="24" y="152" class="c">Marcus B.</text>
    <rect x="250" y="138" width="112" height="22" rx="11" fill="#FEF3C7"/><text x="262" y="153" class="p" fill="#B45309">Submitted</text>
    <rect x="520" y="142" width="190" height="10" rx="5" fill="#E2E8F0"/><rect x="520" y="142" width="34" height="10" rx="5" fill="#C2410C"/>
    <text x="760" y="153" class="s">Waiting on funding</text>

    <line x1="16" y1="176" x2="1112" y2="176" stroke="#F1F5F9"/>
    <text x="24" y="214" class="c">Lena H.</text>
    <rect x="250" y="200" width="112" height="22" rx="11" fill="#FEE2E2"/><text x="262" y="215" class="p" fill="#B91C1C">Needs docs</text>
    <rect x="520" y="204" width="190" height="10" rx="5" fill="#E2E8F0"/><rect x="520" y="204" width="20" height="10" rx="5" fill="#C2410C"/>
    <text x="760" y="215" class="s">Alert sent to sales rep</text>

    <rect x="16" y="240" width="1096" height="32" rx="8" fill="#0F172A"/>
    <text x="34" y="261" font-size="12" font-weight="600" fill="#FFFFFF">Alert: funding status changed. The sales rep is notified and the deal view updates.</text>
  </g>
</svg>
