  <circle cx="886" cy="24" r="3.5" fill="#94A3B8"/>
  <text x="896" y="28" font-family="Inter, sans-serif" font-size="11" fill="#475569" font-weight="600">Demo</text>

  <!-- Left Rail: Pipeline Stages -->
  <rect x="0" y="48" width="196" height="552" fill="#FFFFFF"/>
  <line x1="196" y1="48" x2="196" y2="600" stroke="#E2E8F0" stroke-width="1.5"/>

  <text x="24" y="80" font-family="Inter, sans-serif" font-size="11" fill="#94A3B8" font-weight="700" letter-spacing="0.5">PIPELINE STAGES</text>

  <circle cx="28" cy="110" r="4" fill="#3B82F6"/>
  <text x="40" y="114" font-family="Inter, sans-serif" font-size="12" fill="#475569" font-weight="500">New lead</text>
  <circle cx="28" cy="140" r="4" fill="#F59E0B"/>
  <text x="40" y="144" font-family="Inter, sans-serif" font-size="12" fill="#475569" font-weight="500">Site survey booked</text>
  <circle cx="28" cy="170" r="4" fill="#8B5CF6"/>
  <text x="40" y="174" font-family="Inter, sans-serif" font-size="12" fill="#475569" font-weight="500">Proposal sent</text>
  <rect x="12" y="186" width="172" height="28" rx="6" fill="#FFF7ED"/>
  <circle cx="28" cy="200" r="4" fill="#C2410C"/>
  <text x="40" y="204" font-family="Inter, sans-serif" font-size="12" fill="#C2410C" font-weight="600">Signed</text>
  <circle cx="28" cy="230" r="4" fill="#0EA5E9"/>
  <text x="40" y="234" font-family="Inter, sans-serif" font-size="11.5" fill="#475569" font-weight="500">Permit and interconnection</text>
  <circle cx="28" cy="260" r="4" fill="#14B8A6"/>
  <text x="40" y="264" font-family="Inter, sans-serif" font-size="12" fill="#475569" font-weight="500">Install</text>
