    <rect x="22" y="54" width="132" height="18" rx="4" fill="#EFF6FF"/>
    <text x="28" y="67" font-family="Inter, sans-serif" font-size="10" fill="#2563EB" font-weight="600">8 KW SOLAR + BATTERY</text>
    <text x="22" y="88" font-family="Inter, sans-serif" font-size="13" fill="#0F172A" font-weight="600">Sarah M.</text>
    <text x="22" y="104" font-family="Inter, sans-serif" font-size="11" fill="#64748B">Web form · 2 min ago</text>
    <rect x="22" y="118" width="104" height="20" rx="10" fill="#ECFDF5"/>
    <text x="28" y="132" font-family="Inter, sans-serif" font-size="10" fill="#059669" font-weight="600">Text reply sent</text>
    <circle cx="190" cy="128" r="10" fill="#E2E8F0"/>
    <text x="184" y="132" font-family="Inter, sans-serif" font-size="10" fill="#475569" font-weight="600">SM</text>

