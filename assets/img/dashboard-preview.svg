    <rect x="194" y="10" width="24" height="18" rx="9" fill="#E2E8F0"/>
    <text x="202" y="23" font-family="Inter, sans-serif" font-size="11" fill="#475569" font-weight="600">3</text>
    
    <!-- Card 1 -->
    <rect x="10" y="42" width="212" height="120" rx="8" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <rect x="22" y="54" width="76" height="18" rx="4" fill="#EFF6FF"/>
    <text x="28" y="67" font-family="Inter, sans-serif" font-size="10" fill="#2563EB" font-weight="600">KITCHEN GUTFIT</text>
    <text x="22" y="88" font-family="Inter, sans-serif" font-size="13" fill="#0F172A" font-weight="600">Harrison Residence</text>
    <text x="22" y="104" font-family="Inter, sans-serif" font-size="11" fill="#64748B">Est. Budget: $145,000</text>
    <rect x="22" y="118" width="108" height="20" rx="10" fill="#ECFDF5"/>
    <text x="28" y="132" font-family="Inter, sans-serif" font-size="10" fill="#059669" font-weight="600">⚡ Auto-SMS in 42s</text>
    <circle cx="196" cy="128" r="10" fill="#E2E8F0"/>
    <text x="192" y="132" font-family="Inter, sans-serif" font-size="10" fill="#475569" font-weight="600">MH</text>

    <!-- Card 2 -->
    <rect x="10" y="172" width="212" height="120" rx="8" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <rect x="22" y="184" width="86" height="18" rx="4" fill="#FDF4FF"/>
    <text x="28" y="197" font-family="Inter, sans-serif" font-size="10" fill="#9333EA" font-weight="600">MASTER SUITE</text>
    <text x="22" y="218" font-family="Inter, sans-serif" font-size="13" fill="#0F172A" font-weight="600">Vance Remodel</text>
    <text x="22" y="234" font-family="Inter, sans-serif" font-size="11" fill="#64748B">Est. Budget: $210,000</text>
    <rect x="22" y="248" width="112" height="20" rx="10" fill="#FFF7ED"/>
    <text x="28" y="262" font-family="Inter, sans-serif" font-size="10" fill="#C2410C" font-weight="600">📅 Map Call Booked</text>
    <circle cx="196" cy="258" r="10" fill="#E2E8F0"/>
    <text x="192" y="262" font-family="Inter, sans-serif" font-size="10" fill="#475569" font-weight="600">RK</text>
  </g>

  <!-- Column 2: Scope & Estimating -->
  <g transform="translate(452, 124)">
    <rect x="0" y="0" width="232" height="456" rx="8" fill="#F1F5F9"/>
    <rect x="12" y="12" width="10" height="10" rx="3" fill="#F59E0B"/>
    <text x="30" y="22" font-family="Inter, sans-serif" font-size="13" fill="#0F172A" font-weight="700">Estimating &amp; Selections</text>
    <rect x="194" y="10" width="24" height="18" rx="9" fill="#E2E8F0"/>
    <text x="202" y="23" font-family="Inter, sans-serif" font-size="11" fill="#475569" font-weight="600">2</text>
    
    <!-- Card 1 -->
    <rect x="10" y="42" width="212" height="130" rx="8" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <rect x="22" y="54" width="94" height="18" rx="4" fill="#EFF6FF"/>
    <text x="28" y="67" font-family="Inter, sans-serif" font-size="10" fill="#2563EB" font-weight="600">FULL 2-STORY GUT</text>
    <text x="22" y="88" font-family="Inter, sans-serif" font-size="13" fill="#0F172A" font-weight="600">Delaney Estate</text>
    <text x="22" y="104" font-family="Inter, sans-serif" font-size="11" fill="#64748B">Contract: $395,000</text>
    <rect x="22" y="118" width="126" height="20" rx="10" fill="#FEF3C7"/>
    <text x="28" y="132" font-family="Inter, sans-serif" font-size="10" fill="#B45309" font-weight="600">Tile Selections Approved</text>
    <rect x="22" y="144" width="168" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="22" y="144" width="140" height="6" rx="3" fill="#10B981"/>
  </g>

  <!-- Column 3: Sale-to-Job Handoff (Key Differentiator) -->
  <g transform="translate(700, 124)">
    <rect x="0" y="0" width="236" height="456" rx="8" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5"/>
    <rect x="12" y="12" width="10" height="10" rx="3" fill="#C2410C"/>
    <text x="30" y="22" font-family="Inter, sans-serif" font-size="13" fill="#9A3412" font-weight="700">Sale → PM Handoff</text>
    <rect x="198" y="10" width="24" height="18" rx="9" fill="#FFEDD5"/>
    <text x="206" y="23" font-family="Inter, sans-serif" font-size="11" fill="#9A3412" font-weight="700">1</text>
    
    <!-- Hero Handoff Card -->
    <rect x="10" y="42" width="216" height="175" rx="8" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <rect x="22" y="54" width="105" height="18" rx="4" fill="#FFEDD5"/>
    <text x="28" y="67" font-family="Inter, sans-serif" font-size="10" fill="#C2410C" font-weight="700">HANDOFF TRIGGERED</text>
    <text x="22" y="88" font-family="Inter, sans-serif" font-size="14" fill="#0F172A" font-weight="700">Patterson Project</text>
    <text x="22" y="104" font-family="Inter, sans-serif" font-size="11" fill="#64748B">Contract Signed: $185,000</text>
    
    <!-- Checklist items automated -->
    <circle cx="28" cy="124" r="5" fill="#10B981"/>
    <text x="38" y="128" font-family="Inter, sans-serif" font-size="10" fill="#334155">Drive folder &amp; drawings created</text>
    
    <circle cx="28" cy="142" r="5" fill="#10B981"/>
    <text x="38" y="146" font-family="Inter, sans-serif" font-size="10" fill="#334155">Production board populated</text>
    
    <circle cx="28" cy="160" r="5" fill="#10B981"/>
    <text x="38" y="164" font-family="Inter, sans-serif" font-size="10" fill="#334155">PM intro &amp; trade invites sent</text>
    
    <rect x="22" y="180" width="192" height="24" rx="4" fill="#0F172A"/>
    <text x="56" y="196" font-family="Inter, sans-serif" font-size="11" fill="#FFFFFF" font-weight="600">Zero Dropped Scope ✓</text>
  </g>
