    <rect x="22" y="184" width="82" height="18" rx="4" fill="#FDF4FF"/>
    <text x="28" y="197" font-family="Inter, sans-serif" font-size="10" fill="#9333EA" font-weight="600">EV CHARGER</text>
    <text x="22" y="218" font-family="Inter, sans-serif" font-size="13" fill="#0F172A" font-weight="600">James T.</text>
    <text x="22" y="234" font-family="Inter, sans-serif" font-size="11" fill="#64748B">Referral · today</text>
    <rect x="22" y="248" width="112" height="20" rx="10" fill="#FFF7ED"/>
    <text x="28" y="262" font-family="Inter, sans-serif" font-size="10" fill="#C2410C" font-weight="600">Follow-up 2 of 5</text>
    <circle cx="190" cy="258" r="10" fill="#E2E8F0"/>
    <text x="185" y="262" font-family="Inter, sans-serif" font-size="10" fill="#475569" font-weight="600">JT</text>
  </g>

  <!-- Column 2: Site survey booked -->
  <g transform="translate(456, 124)">
    <rect x="0" y="0" width="226" height="456" rx="8" fill="#F1F5F9"/>
    <rect x="12" y="12" width="10" height="10" rx="3" fill="#F59E0B"/>
    <text x="30" y="22" font-family="Inter, sans-serif" font-size="13" fill="#0F172A" font-weight="700">Site survey booked</text>
    <rect x="188" y="10" width="24" height="18" rx="9" fill="#E2E8F0"/>
    <text x="196" y="23" font-family="Inter, sans-serif" font-size="11" fill="#475569" font-weight="600">1</text>

    <!-- Card 1 -->
    <rect x="10" y="42" width="206" height="130" rx="8" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <rect x="22" y="54" width="78" height="18" rx="4" fill="#EFF6FF"/>
    <text x="28" y="67" font-family="Inter, sans-serif" font-size="10" fill="#2563EB" font-weight="600">6 KW SOLAR</text>
    <text x="22" y="88" font-family="Inter, sans-serif" font-size="13" fill="#0F172A" font-weight="600">Priya K.</text>
    <text x="22" y="104" font-family="Inter, sans-serif" font-size="11" fill="#64748B">Survey: Thu 10:00 AM</text>
    <rect x="22" y="118" width="122" height="20" rx="10" fill="#FEF3C7"/>
    <text x="28" y="132" font-family="Inter, sans-serif" font-size="10" fill="#B45309" font-weight="600">Reminder scheduled</text>
    <rect x="22" y="148" width="168" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="22" y="148" width="56" height="6" rx="3" fill="#F59E0B"/>
  </g>

  <!-- Column 3: Signed (handoff to install) -->
  <g transform="translate(696, 124)">
    <rect x="0" y="0" width="240" height="456" rx="8" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5"/>
    <rect x="12" y="12" width="10" height="10" rx="3" fill="#C2410C"/>
    <text x="30" y="22" font-family="Inter, sans-serif" font-size="13" fill="#9A3412" font-weight="700">Signed</text>
    <rect x="202" y="10" width="24" height="18" rx="9" fill="#FFEDD5"/>
    <text x="210" y="23" font-family="Inter, sans-serif" font-size="11" fill="#9A3412" font-weight="700">1</text>

    <!-- Handoff Card -->
    <rect x="10" y="42" width="220" height="175" rx="8" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <rect x="22" y="54" width="132" height="18" rx="4" fill="#FFEDD5"/>
    <text x="28" y="67" font-family="Inter, sans-serif" font-size="10" fill="#C2410C" font-weight="700">10 KW SOLAR + BATTERY</text>
    <text x="22" y="88" font-family="Inter, sans-serif" font-size="14" fill="#0F172A" font-weight="700">Emma L.</text>
    <text x="22" y="104" font-family="Inter, sans-serif" font-size="11" fill="#64748B">Contract signed · financing approved</text>

    <circle cx="28" cy="124" r="5" fill="#10B981"/>
    <text x="38" y="128" font-family="Inter, sans-serif" font-size="10" fill="#334155">Survey photos attached to job</text>

    <circle cx="28" cy="142" r="5" fill="#10B981"/>
    <text x="38" y="146" font-family="Inter, sans-serif" font-size="10" fill="#334155">Permit and interconnection tasks set</text>

    <circle cx="28" cy="160" r="5" fill="#10B981"/>
    <text x="38" y="164" font-family="Inter, sans-serif" font-size="10" fill="#334155">Homeowner update text queued</text>

    <rect x="22" y="180" width="196" height="24" rx="4" fill="#0F172A"/>
    <text x="120" y="196" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#FFFFFF" font-weight="600">Install checklist created</text>
  </g>
