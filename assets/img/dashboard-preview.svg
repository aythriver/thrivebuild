<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <!-- Browser Chrome Window Frame -->
  <rect x="0" y="0" width="960" height="600" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Browser Window Header Bar -->
  <path d="M 0 16 Q 0 0 16 0 L 944 0 Q 960 0 960 16 L 960 48 L 0 48 Z" fill="#FFFFFF"/>
  <line x1="0" y1="48" x2="960" y2="48" stroke="#E2E8F0" stroke-width="1.5"/>
  
  <!-- Window Controls -->
  <circle cx="28" cy="24" r="6" fill="#EF4444"/>
  <circle cx="48" cy="24" r="6" fill="#F59E0B"/>
  <circle cx="68" cy="24" r="6" fill="#10B981"/>
  
  <!-- Browser URL Bar -->
  <rect x="110" y="12" width="560" height="24" rx="6" fill="#F1F5F9"/>
  <text x="130" y="28" font-family="Inter, sans-serif" font-size="12" fill="#64748B" font-weight="500">🔒 thrivebuild.monday.com/boards/remodel-pipeline-os</text>
  
  <!-- Status Badge Right -->
  <rect x="790" y="12" width="145" height="24" rx="12" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
  <circle cx="804" cy="24" r="3.5" fill="#10B981"/>
  <text x="814" y="28" font-family="Inter, sans-serif" font-size="11" fill="#047857" font-weight="600">Make.com Active</text>

  <!-- Main Board Area -->
  <!-- Left Navigation Rail -->
  <rect x="0" y="48" width="180" height="552" fill="#FFFFFF"/>
  <line x1="180" y1="48" x2="180" y2="600" stroke="#E2E8F0" stroke-width="1.5"/>
  
  <text x="24" y="80" font-family="Inter, sans-serif" font-size="11" fill="#94A3B8" font-weight="700" letter-spacing="0.5">WORKSPACE</text>
  
  <!-- Nav Items -->
  <rect x="12" y="94" width="156" height="32" rx="6" fill="#FFF7ED"/>
  <circle cx="28" cy="110" r="4" fill="#C2410C"/>
  <text x="42" y="114" font-family="Inter, sans-serif" font-size="13" fill="#C2410C" font-weight="600">Active Pipeline</text>
  
  <text x="42" y="146" font-family="Inter, sans-serif" font-size="13" fill="#475569" font-weight="500">Lead Speed-to-Call</text>
  <text x="42" y="178" font-family="Inter, sans-serif" font-size="13" fill="#475569" font-weight="500">Sales → PM Handoff</text>
  <text x="42" y="210" font-family="Inter, sans-serif" font-size="13" fill="#475569" font-weight="500">Selection Deadlines</text>
  <text x="42" y="242" font-family="Inter, sans-serif" font-size="13" fill="#475569" font-weight="500">Subcontractor Sync</text>
  
  <!-- Board Header -->
  <rect x="180" y="48" width="780" height="60" fill="#FFFFFF"/>
  <line x1="180" y1="108" x2="960" y2="108" stroke="#E2E8F0" stroke-width="1.5"/>
  
  <text x="206" y="84" font-family="Inter, sans-serif" font-size="18" fill="#0F172A" font-weight="700">Residential Remodel Operating System</text>
  <rect x="710" y="66" width="110" height="28" rx="6" fill="#F1F5F9"/>
  <text x="724" y="84" font-family="Inter, sans-serif" font-size="12" fill="#334155" font-weight="600">⚡ Automations (18)</text>
  <rect x="830" y="66" width="105" height="28" rx="6" fill="#0F172A"/>
  <text x="848" y="84" font-family="Inter, sans-serif" font-size="12" fill="#FFFFFF" font-weight="600">+ New Lead</text>

