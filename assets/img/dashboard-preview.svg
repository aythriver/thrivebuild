<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <!-- Browser Chrome Window Frame -->
  <rect x="0" y="0" width="960" height="600" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Browser Window Header Bar -->
  <path d="M 0 16 Q 0 0 16 0 L 944 0 Q 960 0 960 16 L 960 48 L 0 48 Z" fill="#FFFFFF"/>
  <line x1="0" y1="48" x2="960" y2="48" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Window Controls -->
  <circle cx="28" cy="24" r="6" fill="#EF4444"/>
  <circle cx="48" cy="24" r="6" fill="#F59E0B"/>
  <circle cx="68" cy="24" r="6" fill="#10B981"/>

  <!-- Browser URL Bar -->
  <rect x="110" y="12" width="560" height="24" rx="6" fill="#F1F5F9"/>
  <text x="130" y="28" font-family="Inter, sans-serif" font-size="12" fill="#64748B" font-weight="500">Solar install pipeline · example board</text>

  <!-- Demo Badge Right -->
